<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Equity Table — A Mesa de Equity</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♠️</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0B3B2E; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useCallback } = React;

/* ============================== POKER ENGINE ============================== */

const SUITS = ["s", "h", "d", "c"];
const SUIT_SYMBOL = { s: "♠", h: "♥", d: "♦", c: "♣" };
const SUIT_RED = { s: false, h: true, d: true, c: false };
const RANK_CHARS = ["A", "K", "Q", "J", "T", "9", "8", "7", "6", "5", "4", "3", "2"];
const RANK_VALUE = { A: 14, K: 13, Q: 12, J: 11, T: 10, 9: 9, 8: 8, 7: 7, 6: 6, 5: 5, 4: 4, 3: 3, 2: 2 };
const CATEGORY_NAMES = {
  pt: ["Carta alta", "Um par", "Dois pares", "Trinca", "Sequência", "Flush", "Full house", "Quadra", "Straight flush"],
  en: ["High card", "One pair", "Two pair", "Three of a kind", "Straight", "Flush", "Full house", "Four of a kind", "Straight flush"],
};

const FULL_DECK = RANK_CHARS.flatMap((r) =>
  SUITS.map((s) => ({ rank: RANK_VALUE[r], suit: s, char: r, key: r + s }))
);

function kCombinations(n, k) {
  const results = [];
  const combo = [];
  function backtrack(start) {
    if (combo.length === k) { results.push([...combo]); return; }
    for (let i = start; i < n; i++) { combo.push(i); backtrack(i + 1); combo.pop(); }
  }
  backtrack(0);
  return results;
}
const COMBOS_5_OF_5 = kCombinations(5, 5);
const COMBOS_5_OF_6 = kCombinations(6, 5);
const COMBOS_5_OF_7 = kCombinations(7, 5);

function evaluate5(cards) {
  const ranks = cards.map((c) => c.rank).sort((a, b) => b - a);
  const suits = cards.map((c) => c.suit);
  const isFlush = suits.every((s) => s === suits[0]);
  const uniqueRanks = [...new Set(ranks)];
  let straightHigh = null;
  if (uniqueRanks.length === 5) {
    if (uniqueRanks[0] - uniqueRanks[4] === 4) straightHigh = uniqueRanks[0];
    else if (uniqueRanks.join(",") === "14,5,4,3,2") straightHigh = 5;
  }
  const counts = {};
  ranks.forEach((r) => (counts[r] = (counts[r] || 0) + 1));
  const groups = Object.entries(counts)
    .map(([r, c]) => ({ rank: Number(r), count: c }))
    .sort((a, b) => b.count - a.count || b.rank - a.rank);

  if (straightHigh && isFlush) return [8, straightHigh];
  if (groups[0].count === 4) return [7, groups[0].rank, groups[1].rank];
  if (groups[0].count === 3 && groups[1].count === 2) return [6, groups[0].rank, groups[1].rank];
  if (isFlush) return [5, ...ranks];
  if (straightHigh) return [4, straightHigh];
  if (groups[0].count === 3) return [3, groups[0].rank, ...groups.slice(1).map((g) => g.rank)];
  if (groups[0].count === 2 && groups[1].count === 2) {
    const pairRanks = [groups[0].rank, groups[1].rank].sort((a, b) => b - a);
    return [2, ...pairRanks, groups[2].rank];
  }
  if (groups[0].count === 2) return [1, groups[0].rank, ...groups.slice(1).map((g) => g.rank)];
  return [0, ...ranks];
}

function compareArr(a, b) {
  const len = Math.max(a.length, b.length);
  for (let i = 0; i < len; i++) {
    const av = a[i] ?? -1;
    const bv = b[i] ?? -1;
    if (av !== bv) return av - bv;
  }
  return 0;
}

function bestHand(cards) {
  const n = cards.length;
  const combos = n === 5 ? COMBOS_5_OF_5 : n === 6 ? COMBOS_5_OF_6 : COMBOS_5_OF_7;
  let best = null;
  for (const idxs of combos) {
    const hand = idxs.map((i) => cards[i]);
    const val = evaluate5(hand);
    if (!best || compareArr(val, best) > 0) best = val;
  }
  return best;
}

function generateComboCards(key) {
  const suited = key.endsWith("s");
  const offsuit = key.endsWith("o");
  const r1 = key[0];
  const r2 = key[1];
  const combos = [];
  if (!suited && !offsuit) {
    for (let i = 0; i < SUITS.length; i++)
      for (let j = i + 1; j < SUITS.length; j++)
        combos.push([
          { rank: RANK_VALUE[r1], suit: SUITS[i], char: r1, key: r1 + SUITS[i] },
          { rank: RANK_VALUE[r1], suit: SUITS[j], char: r1, key: r1 + SUITS[j] },
        ]);
  } else if (suited) {
    for (const s of SUITS)
      combos.push([
        { rank: RANK_VALUE[r1], suit: s, char: r1, key: r1 + s },
        { rank: RANK_VALUE[r2], suit: s, char: r2, key: r2 + s },
      ]);
  } else {
    for (const s1 of SUITS)
      for (const s2 of SUITS) {
        if (s1 === s2) continue;
        combos.push([
          { rank: RANK_VALUE[r1], suit: s1, char: r1, key: r1 + s1 },
          { rank: RANK_VALUE[r2], suit: s2, char: r2, key: r2 + s2 },
        ]);
      }
  }
  return combos;
}

function shuffleSample(arr, k) {
  const a = arr.slice();
  const n = a.length;
  const take = [];
  for (let i = 0; i < k && i < n; i++) {
    const j = i + Math.floor(Math.random() * (n - i));
    [a[i], a[j]] = [a[j], a[i]];
    take.push(a[i]);
  }
  return take;
}

function buildSimSetup({ hero, board, villainMode, villainFixed, rangeCombosAll }) {
  const knownKeys = new Set([...hero, ...board].map((c) => c.key));
  let baseDeck = FULL_DECK.filter((c) => !knownKeys.has(c.key));
  let comboPool = null;
  if (villainMode === "range") {
    comboPool = rangeCombosAll.filter((combo) => !knownKeys.has(combo[0].key) && !knownKeys.has(combo[1].key));
    if (comboPool.length === 0) return null;
  } else {
    baseDeck = baseDeck.filter((c) => c.key !== villainFixed[0].key && c.key !== villainFixed[1].key);
  }
  const deckSizeAtStart = FULL_DECK.length - knownKeys.size;
  return { baseDeck, comboPool, deckSizeAtStart };
}

function runBatch(setup, hero, board, villainMode, villainFixed, count) {
  let heroWin = 0, tie = 0, villWin = 0;
  const needed = 5 - board.length;
  const { baseDeck, comboPool } = setup;
  for (let t = 0; t < count; t++) {
    let villHand, deck;
    if (villainMode === "range") {
      villHand = comboPool[Math.floor(Math.random() * comboPool.length)];
      deck = baseDeck.filter((c) => c.key !== villHand[0].key && c.key !== villHand[1].key);
    } else {
      villHand = villainFixed;
      deck = baseDeck;
    }
    const extra = needed > 0 ? shuffleSample(deck, needed) : [];
    const fullBoard = board.concat(extra);
    const heroVal = bestHand(hero.concat(fullBoard));
    const villVal = bestHand(villHand.concat(fullBoard));
    const cmp = compareArr(heroVal, villVal);
    if (cmp > 0) heroWin++;
    else if (cmp < 0) villWin++;
    else tie++;
  }
  return { heroWin, tie, villWin };
}

function simulate({ hero, board, villainMode, villainFixed, rangeCombosAll, trials }) {
  const setup = buildSimSetup({ hero, board, villainMode, villainFixed, rangeCombosAll });
  if (!setup) return null;
  const r = runBatch(setup, hero, board, villainMode, villainFixed, trials);
  return { ...r, trials, deckSizeAtStart: setup.deckSizeAtStart, comboPoolSize: setup.comboPool ? setup.comboPool.length : null };
}

function computeOuts(hero, board) {
  if (board.length !== 3 && board.length !== 4) return null;
  const knownKeys = new Set([...hero, ...board].map((c) => c.key));
  const deck = FULL_DECK.filter((c) => !knownKeys.has(c.key));
  const currentVal = bestHand(hero.concat(board));
  const outsCards = [];
  for (const card of deck) {
    const newVal = bestHand(hero.concat(board).concat([card]));
    if (compareArr(newVal, currentVal) > 0) outsCards.push(card);
  }
  const cardsToCome = board.length === 3 ? 2 : 1;
  const ruleEstimate = Math.min(outsCards.length * (cardsToCome === 2 ? 4 : 2), 100);
  const remaining = deck.length;
  const nonouts = remaining - outsCards.length;
  const exactPct = cardsToCome === 2
    ? (1 - nCr(nonouts, 2) / nCr(remaining, 2)) * 100
    : (outsCards.length / remaining) * 100;
  return { outsCards, count: outsCards.length, cardsToCome, ruleEstimate, exactPct, remaining, currentCategory: currentVal[0] };
}

function nCr(n, k) {
  if (k < 0 || k > n) return 0;
  k = Math.min(k, n - k);
  let result = 1;
  for (let i = 0; i < k; i++) result = (result * (n - i)) / (i + 1);
  return Math.round(result);
}

/* ================================ RANGE GRID ================================ */

function cellKey(i, j) {
  const hi = Math.min(i, j), lo = Math.max(i, j);
  if (i === j) return RANK_CHARS[i] + RANK_CHARS[i];
  return RANK_CHARS[hi] + RANK_CHARS[lo] + (i < j ? "s" : "o");
}

const PRESETS = {
  clear: () => new Set(),
  pairs: () => new Set(RANK_CHARS.map((r) => r + r)),
  broadway: () => { const s = new Set(); for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) s.add(cellKey(i, j)); return s; },
  suitedConnectors: () => { const s = new Set(); for (let i = 0; i < 12; i++) s.add(cellKey(i, i + 1)); return s; },
  premium: () => new Set(["AA", "KK", "QQ", "JJ", "TT", "AKs", "AKo", "AQs", "AQo", "AJs", "KQs"]),
  wide: () => {
    const s = new Set(RANK_CHARS.map((r) => r + r));
    for (let j = 0; j < 13; j++) if (j !== 0) s.add(cellKey(0, j));
    for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) s.add(cellKey(i, j));
    for (let i = 0; i < 9; i++) s.add(cellKey(i, i + 1));
    return s;
  },
};

const PRESET_LABELS = {
  pt: { clear: "Limpar", pairs: "Pares", broadway: "Broadway", suited: "Conectores suited", premium: "Premium", wide: "Range largo" },
  en: { clear: "Clear", pairs: "Pairs", broadway: "Broadway", suited: "Suited connectors", premium: "Premium", wide: "Wide range" },
};

/* ================================ UI HELPERS ================================ */

const C = { felt: "#0B3B2E", ivory: "#EDE6D6", card: "#F3ECDA", ink: "#1C1B19", brass: "#C9A24B", ruby: "#A83246" };

function Card({ card, onClick, small, dim }) {
  const w = small ? 34 : 52, h = small ? 48 : 74;
  if (!card) {
    return (
      <button onClick={onClick} style={{ width: w, height: h, borderRadius: 7, border: "1.5px dashed rgba(201,162,75,0.55)", background: "rgba(237,230,214,0.06)", color: "rgba(237,230,214,0.55)", fontSize: small ? 14 : 20, fontFamily: "'IBM Plex Mono', monospace" }} className="flex items-center justify-center transition hover:bg-[rgba(237,230,214,0.14)]">+</button>
    );
  }
  const red = SUIT_RED[card.suit];
  return (
    <button onClick={onClick} disabled={!onClick} style={{ width: w, height: h, borderRadius: 7, border: "1.5px solid #C9A24B", background: C.card, color: red ? C.ruby : C.ink, fontFamily: "'IBM Plex Mono', monospace", boxShadow: "0 2px 6px rgba(0,0,0,0.3)", opacity: dim ? 0.5 : 1 }} className="flex flex-col items-center justify-center leading-none transition hover:-translate-y-0.5">
      <span style={{ fontSize: small ? 12 : 19, fontWeight: 700 }}>{card.char}</span>
      <span style={{ fontSize: small ? 12 : 19 }}>{SUIT_SYMBOL[card.suit]}</span>
    </button>
  );
}

function Ratio({ pct }) {
  if (pct <= 0) return <span>—</span>;
  if (pct >= 100) return <span>lock</span>;
  return <span>{((100 - pct) / pct).toFixed(2)}:1</span>;
}

function Section({ title, note, children }) {
  return (
    <div style={{ marginBottom: 24 }}>
      <div className="flex items-baseline justify-between mb-2.5">
        <h3 className="display" style={{ fontSize: 19, fontWeight: 600, color: C.ink }}>{title}</h3>
        {note && <span className="mono" style={{ fontSize: 11.5, color: "rgba(28,27,25,0.5)" }}>{note}</span>}
      </div>
      {children}
    </div>
  );
}

function StageBtn({ label, active, disabled, onClick }) {
  return (
    <button onClick={onClick} disabled={disabled} className="mono" style={{ fontSize: 11.5, padding: "6px 10px", borderRadius: 6, border: "1px solid rgba(28,27,25,0.2)", background: active ? C.felt : "#fff", color: active ? C.ivory : disabled ? "rgba(28,27,25,0.3)" : C.ink, opacity: disabled ? 0.5 : 1 }}>{label}</button>
  );
}

function ModeBtn({ label, active, onClick }) {
  return (
    <button onClick={onClick} style={{ fontSize: 13, padding: "7px 14px", borderRadius: 7, fontWeight: 500, border: active ? `1px solid ${C.felt}` : "1px solid rgba(28,27,25,0.2)", background: active ? C.felt : "#fff", color: active ? C.ivory : C.ink }}>{label}</button>
  );
}

function PresetBtn({ label, onClick }) {
  return <button onClick={onClick} className="mono" style={{ fontSize: 11, padding: "5px 9px", borderRadius: 5, border: "1px solid rgba(11,59,46,0.3)", background: "rgba(11,59,46,0.06)", color: C.felt }}>{label}</button>;
}

function Stat({ label, pct, color }) {
  return (
    <div>
      <div style={{ fontSize: 12.5, color: "rgba(28,27,25,0.6)" }}>{label}</div>
      <div className="mono" style={{ fontSize: 26, fontWeight: 700, color }}>{pct.toFixed(1)}%</div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div>
      <div style={{ fontSize: 12, color: "rgba(28,27,25,0.6)", marginBottom: 5 }}>{label}</div>
      {children}
    </div>
  );
}

function Glossary({ symbol, title, text }) {
  return (
    <div style={{ background: "rgba(11,59,46,0.05)", borderRadius: 10, padding: "14px 16px", border: "1px solid rgba(11,59,46,0.12)" }}>
      <div style={{ fontSize: 18, color: C.felt, marginBottom: 6 }}>{symbol}</div>
      <div style={{ fontWeight: 600, fontSize: 14.5, marginBottom: 4, color: C.ink }}>{title}</div>
      <div style={{ fontSize: 13, lineHeight: 1.55, color: "rgba(28,27,25,0.75)" }}>{text}</div>
    </div>
  );
}

function Expand({ label, children }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ margin: "12px 0 4px" }}>
      <button onClick={() => setOpen(!open)} className="mono" style={{ fontSize: 12.5, color: C.felt, background: "rgba(11,59,46,0.08)", border: "1px solid rgba(11,59,46,0.25)", borderRadius: 6, padding: "7px 13px", fontWeight: 600 }}>
        {open ? "▾ " : "▸ "}{label}
      </button>
      {open && (
        <div style={{ marginTop: 12, padding: "14px 16px", background: "rgba(28,27,25,0.03)", borderLeft: `3px solid ${C.brass}`, borderRadius: 6, fontSize: 13.5, lineHeight: 1.75, color: "rgba(28,27,25,0.85)" }}>
          {children}
        </div>
      )}
    </div>
  );
}

const inputStyle = { border: "1px solid rgba(28,27,25,0.25)", borderRadius: 6, padding: "8px 10px", fontSize: 14, width: 140, background: "#fff" };

/* ================================ RANGE GRID COMPONENT ================================ */

function RangeGrid({ lang, rangeSelection, toggleRangeCell, applyPreset }) {
  const L = PRESET_LABELS[lang];
  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-3">
        <PresetBtn label={L.clear} onClick={() => applyPreset(PRESETS.clear)} />
        <PresetBtn label={L.pairs} onClick={() => applyPreset(PRESETS.pairs)} />
        <PresetBtn label={L.broadway} onClick={() => applyPreset(PRESETS.broadway)} />
        <PresetBtn label={L.suited} onClick={() => applyPreset(PRESETS.suitedConnectors)} />
        <PresetBtn label={L.premium} onClick={() => applyPreset(PRESETS.premium)} />
        <PresetBtn label={L.wide} onClick={() => applyPreset(PRESETS.wide)} />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(13, minmax(0,1fr))", gap: 2, maxWidth: 480 }}>
        {RANK_CHARS.map((_, i) =>
          RANK_CHARS.map((__, j) => {
            const key = cellKey(i, j);
            const selected = rangeSelection.has(key);
            const isPair = i === j, isSuited = i < j;
            return (
              <button key={key} onClick={() => toggleRangeCell(key)} title={key} style={{
                aspectRatio: "1", fontSize: 8.5, fontFamily: "'IBM Plex Mono', monospace", borderRadius: 3,
                border: "1px solid rgba(28,27,25,0.15)",
                background: selected ? C.felt : isPair ? "rgba(201,162,75,0.18)" : isSuited ? "rgba(11,59,46,0.08)" : "rgba(28,27,25,0.04)",
                color: selected ? C.ivory : C.ink, fontWeight: isPair ? 700 : 500,
              }}>{key}</button>
            );
          })
        )}
      </div>
    </div>
  );
}

/* ================================== PAGES ================================== */

function CalculadoraPage(state) {
  const {
    lang, heroCards, boardCount, boardCards, villainMode, setVillainMode, villainCards,
    rangeSelection, toggleRangeCell, applyPreset, trials, setTrials, results, simulating, progress,
    error, openPicker, setBoardCount, setBoardCards, setResults, runSimulation, setActivePage,
  } = state;

  const heroPct = results ? ((results.heroWin + results.tie / 2) / results.trials) * 100 : null;
  const villPct = results ? ((results.villWin + results.tie / 2) / results.trials) * 100 : null;
  const tiePct = results ? (results.tie / results.trials) * 100 : null;
  const locale = lang === "en" ? "en-US" : "pt-BR";

  if (lang === "en") {
    return (
      <>
        <Section title="Your hand" note="Two cards">
          <div className="flex gap-3">
            <Card card={heroCards[0]} onClick={() => openPicker("hero", 0)} />
            <Card card={heroCards[1]} onClick={() => openPicker("hero", 1)} />
          </div>
        </Section>

        <Section title="Board" note={boardCount === 0 ? "Pre-flop" : boardCount === 3 ? "Flop" : boardCount === 4 ? "Turn" : "River"}>
          <div className="flex flex-wrap items-center gap-3">
            {Array.from({ length: boardCount }).map((_, i) => (
              <Card key={i} card={boardCards[i]} onClick={() => openPicker("board", i)} />
            ))}
            <div className="flex gap-2 ml-1">
              <StageBtn label="Flop" active={boardCount >= 3} onClick={() => setBoardCount(3)} />
              <StageBtn label="Turn" active={boardCount >= 4} disabled={boardCount < 3} onClick={() => setBoardCount(4)} />
              <StageBtn label="River" active={boardCount >= 5} disabled={boardCount < 4} onClick={() => setBoardCount(5)} />
              <StageBtn label="Reset" onClick={() => { setBoardCount(0); setBoardCards([null, null, null, null, null]); setResults(null); }} />
            </div>
          </div>
        </Section>

        <Section title="Villain" note={villainMode === "specific" ? "Specific hand" : `${rangeSelection.size} combos in range`}>
          <div className="flex gap-2 mb-3">
            <ModeBtn label="Specific hand" active={villainMode === "specific"} onClick={() => setVillainMode("specific")} />
            <ModeBtn label="Range" active={villainMode === "range"} onClick={() => setVillainMode("range")} />
          </div>
          {villainMode === "specific" ? (
            <div className="flex gap-3">
              <Card card={villainCards[0]} onClick={() => openPicker("villain", 0)} />
              <Card card={villainCards[1]} onClick={() => openPicker("villain", 1)} />
            </div>
          ) : (
            <RangeGrid lang={lang} rangeSelection={rangeSelection} toggleRangeCell={toggleRangeCell} applyPreset={applyPreset} />
          )}
        </Section>

        {error && <div style={{ color: C.ruby, fontSize: 14, marginTop: 4, marginBottom: 12 }}>{error}</div>}

        <div className="flex flex-wrap items-center gap-3 mt-2 mb-3">
          <select value={trials} onChange={(e) => setTrials(Number(e.target.value))} className="mono" style={{ border: "1px solid rgba(28,27,25,0.25)", borderRadius: 6, padding: "8px 10px", background: "#fff", fontSize: 13 }}>
            <option value={1000}>1,000 simulations (instant)</option>
            <option value={5000}>5,000 simulations (fast)</option>
            <option value={20000}>20,000 simulations (precise)</option>
            <option value={100000}>100,000 simulations (very precise, ~1-2s)</option>
            <option value={500000}>500,000 simulations (max precision, may take a while)</option>
          </select>
          <button onClick={runSimulation} disabled={simulating} style={{ background: C.felt, color: C.ivory, border: "none", borderRadius: 8, padding: "10px 22px", fontWeight: 600, fontSize: 14, opacity: simulating ? 0.7 : 1 }}>
            {simulating ? `Calculating… ${Math.round(progress * 100)}%` : "Calculate equity"}
          </button>
        </div>
        {simulating && (
          <div style={{ height: 6, borderRadius: 3, background: "rgba(28,27,25,0.1)", overflow: "hidden", marginBottom: 20, maxWidth: 320 }}>
            <div style={{ width: `${progress * 100}%`, height: "100%", background: C.brass, transition: "width 0.1s" }} />
          </div>
        )}

        {results && (
          <div style={{ borderTop: "1px solid rgba(28,27,25,0.15)", paddingTop: 20, marginBottom: 8 }}>
            <div className="flex flex-wrap gap-6 mb-4">
              <Stat label="You win" pct={heroPct} color={C.felt} />
              <Stat label="Tie" pct={tiePct} color={C.brass} />
              <Stat label="Villain wins" pct={villPct} color={C.ruby} />
            </div>
            <div style={{ height: 14, borderRadius: 7, overflow: "hidden", display: "flex", boxShadow: "inset 0 1px 3px rgba(0,0,0,0.25)" }}>
              <div style={{ width: `${heroPct}%`, background: C.felt }} />
              <div style={{ width: `${tiePct}%`, background: C.brass }} />
              <div style={{ width: `${villPct}%`, background: C.ruby }} />
            </div>

function FundamentosPage({ lang }) {

          </p>

          </div>

          <Expand label="Where does this formula come from? (non-poker example)">
            <p style={{ marginBottom: 10 }}>
              Imagine 4 friends — Anna, Ben, Clara, and Dan — and you want to form a pair for a task.
              How many different pairs exist?
            </p>
            <p style={{ marginBottom: 10 }}>
              <strong>Step 1 — count as if order mattered.</strong> For the 1st spot you have 4 options; once
              chosen, 3 remain for the 2nd spot. That gives 4 × 3 = 12 "ordered arrangements"
              (Anna-Ben, Ben-Anna, Anna-Clara, Clara-Anna, ...).
            </p>
            <p style={{ marginBottom: 10 }}>
              <strong>Step 2 — notice the repetition.</strong> But "Anna-Ben" and "Ben-Anna" are the{" "}
              <em>same</em> pair — order doesn't matter here. Every pair was counted twice (2! = 2 ways to order 2 names).
            </p>
            <p style={{ marginBottom: 10 }}>
              <strong>Step 3 — remove the repetition.</strong> Real pairs = 12 / 2 = <strong>6</strong>{" "}
              (AB, AC, AD, BC, BD, CD — check by counting on your fingers).
            </p>
            <p style={{ marginBottom: 10 }}>
              <strong>Generalizing:</strong> choosing k ordered items from n gives n × (n−1) × ... × (n−k+1) =
              n!/(n−k)!. Since each group of k items can be ordered k! different ways, we divide by k! to count
              each group exactly once. That's exactly C(n,k) = n!/(k!(n−k)!).
            </p>
            <p>
              In poker, n = 52 (the deck) and k = 2 (your hand): C(52,2) = 52×51/2 = <strong>1,326</strong>{" "}

function OutsPage({ lang, heroCards, boardCount, boardCards, setActivePage, results, villainMode }) {
  const heroReady = heroCards[0] && heroCards[1];

            <span className="mono">outs/46 ≈ outs × 2,17%</span>, arredondado para <strong>×2</strong>.
          </p>
          <p>

      <Section title="Contando outs na sua mão atual" note="Usa hero/board da aba Calculadora">

              cálculo exato (hipergeométrico): <strong>{outs.exactPct.toFixed(1)}%</strong>
              {results && villainMode && <><br />equity real simulada (aba Calculadora, já considera o vilão): <strong>{(((results.heroWin + results.tie / 2) / results.trials) * 100).toFixed(1)}%</strong></>}

            <p style={{ fontSize: 12.5, color: "rgba(28,27,25,0.55)", marginTop: 10, lineHeight: 1.6 }}>
              O cálculo exato usa a distribuição hipergeométrica: entre as {outs.remaining} cartas que ainda
              podem sair, {outs.count} são outs. A chance de pelo menos uma delas aparecer em {outs.cardsToCome}{" "}
              carta{outs.cardsToCome > 1 ? "s" : ""} é <span className="mono">1 − C(não-outs, {outs.cardsToCome}) / C(restantes, {outs.cardsToCome})</span>.
              Repare que ele fica um pouco abaixo da regra do {outs.cardsToCome === 2 ? "4" : "2"} — a regra
              superestima de propósito, como uma aproximação rápida.
            </p>
            <Expand label="O cálculo hipergeométrico, explicado com bolinhas numa urna">
              <p style={{ marginBottom: 10 }}>
                Esquece as cartas por um instante. Imagine uma urna com {outs.remaining} bolinhas: {outs.count}{" "}
                delas são <strong>azuis</strong> (seus outs) e {outs.remaining - outs.count} são{" "}
                <strong>vermelhas</strong>. Você vai tirar {outs.cardsToCome} bolinha{outs.cardsToCome > 1 ? "s" : ""}{" "}
                sem devolver. Qual a chance de tirar pelo menos uma azul?

              <p style={{ marginBottom: 10 }}>
                <strong>Caminho mais fácil: calcule o oposto.</strong> "Pelo menos uma azul" é o oposto de "nenhuma

                fazer 1 menos esse valor.
              </p>
              <p style={{ marginBottom: 10 }}>
                A chance de tirar {outs.cardsToCome} bolinhas <em>todas vermelhas</em>, entre{" "}

              </p>
              <p style={{ marginBottom: 10 }}>

              </p>

                mão, as "vermelhas" são as que não ajudam, e a urna é o baralho restante.
              </p>
            </Expand>
          </div>
        )}
      </Section>
    </>
  );
}

function EVPage({ lang, potSize, setPotSize, betToCall, setBetToCall, results, setActivePage }) {
  const [betSize, setBetSize] = useState(40);
  const [equityWhenCalled, setEquityWhenCalled] = useState(25);

  const requiredEquity = potSize + betToCall > 0 ? (betToCall / (potSize + betToCall)) * 100 : 0;
  const heroPct = results ? ((results.heroWin + results.tie / 2) / results.trials) * 100 : null;
  const canDecide = heroPct !== null;
  const isProfitableCall = canDecide && heroPct > requiredEquity;

  const eq = equityWhenCalled / 100;
  const kTerm = eq * (potSize + 2 * betSize) - betSize;
  const requiredFold = potSize - kTerm !== 0 ? Math.max(0, Math.min(100, (-kTerm / (potSize - kTerm)) * 100)) : 0;
  const pureBluffFold = (betSize / (potSize + betSize)) * 100;

  if (lang === "en") {
    return (
      <>
        <Section title="Expected value (EV)">
          <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
            EV is the average of what you win (or lose) if you repeated the same decision infinitely many
            times. For a call, in simplified form:
          </p>
          <div className="mono" style={{ background: "rgba(11,59,46,0.06)", borderRadius: 8, padding: "12px 16px", margin: "12px 0", fontSize: 14, color: C.felt }}>
            EV(call) = (equity × pot if you win) − ((1 − equity) × cost of the call)
          </div>
          <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
            If EV(call) is positive, calling is profitable in the long run — even if you lose <em>this</em>{" "}
            particular hand. That's what separates a good decision from a good result.
          </p>
          <div className="mono" style={{ fontSize: 12.5, background: "rgba(28,27,25,0.04)", borderRadius: 8, padding: "12px 14px", lineHeight: 1.8, color: C.ink }}>
            Example: pot of 80, villain bets 20 (pot becomes 100), you need to call 20.<br />
            Your equity is 30% → EV(call) = 0.30 × 100 − 0.70 × 20 = 30 − 14 = <strong style={{ color: C.felt }}>+16</strong><br />
            Positive EV: calling is profitable, even losing 70% of the time.
          </div>
          <Expand label="Why does this formula work? (a simple bet example)">
            <p style={{ marginBottom: 10 }}>
              Imagine a bet outside of poker: you pay $20 to enter. If a certain event happens (30% chance),
              you get $100 back. If not (70% chance), you lose the $20.
            </p>
            <p style={{ marginBottom: 10 }}>
              <strong>Step 1:</strong> In the 30% of cases it hits, your net gain is $100 (the prize) − $20 (what
              you paid) — but to keep it simple, we treat it as "win the pot" and separately "lose the call" —
              that's how EV is normally calculated in poker, looking at the pot and the cost of the call separately.
            </p>
            <p style={{ marginBottom: 10 }}>
              <strong>Step 2:</strong> Multiply each outcome by its chance: 30% of the time you win the whole pot
              (100) → 0.30 × 100 = 30. 70% of the time you only lose what you paid (20) → 0.70 × 20 = 14 of
              expected loss.
            </p>
            <p style={{ marginBottom: 10 }}>
              <strong>Step 3:</strong> Add expected gain minus expected loss: 30 − 14 = <strong>+16</strong>.
              Positive means that, repeating this decision many times, you come out ahead on average — even
              losing most individual times.
            </p>
            <p>
              Same reasoning as the dice example in the Fundamentals tab: multiply each outcome by its
              probability, and sum.
            </p>
          </Expand>
        </Section>

        <Section title="Pot odds: the shortcut for a call decision">
          <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
            Instead of calculating EV in money, you can convert it directly into <strong>required equity %</strong>:
          </p>
          <div className="mono" style={{ background: "rgba(11,59,46,0.06)", borderRadius: 8, padding: "12px 16px", margin: "12px 0", fontSize: 14, color: C.felt }}>
            required equity = call amount / (pot + call amount)
          </div>
          <Expand label="How this formula is derived from the EV formula above">
            <p style={{ marginBottom: 10 }}>
              We want to find the break-even point: the minimum equity that makes EV(call) = 0 — below it,
              calling loses money; above it, it's profitable.
            </p>
            <p style={{ marginBottom: 10 }}>
              Starting from <span className="mono">EV = equity × pot − (1 − equity) × call</span>, set it to
              zero: <span className="mono">0 = equity × pot − (1 − equity) × call</span>.
            </p>
            <p style={{ marginBottom: 10 }}>
              Expanding: <span className="mono">0 = equity × pot − call + equity × call</span>. Grouping the
              "equity" terms: <span className="mono">call = equity × (pot + call)</span>.
            </p>
            <p>
              Isolating equity: <span className="mono">equity = call / (pot + call)</span> — exactly the pot
              odds formula. It's nothing more than "solving the EV equation for equity equal to zero."
            </p>
          </Expand>
          <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink, margin: "16px 0" }}>
            If your real equity (calculated on the Calculator tab) is <strong>higher</strong> than this required
            %, calling is +EV. If it's lower, it's −EV — fold.
          </p>

          <div className="flex flex-wrap gap-4 mb-3">
            <Field label="Pot size (already including villain's bet)">
              <input type="number" min="0" value={potSize} onChange={(e) => setPotSize(Number(e.target.value))} className="mono" style={inputStyle} />
            </Field>
            <Field label="How much you need to call">
              <input type="number" min="0" value={betToCall} onChange={(e) => setBetToCall(Number(e.target.value))} className="mono" style={inputStyle} />
            </Field>
          </div>
          <p style={{ fontSize: 14.5, lineHeight: 1.6, color: C.ink }}>
            Pot odds of <span className="mono">{potSize}:{betToCall}</span> → you need to win at least{" "}
            <strong className="mono">{requiredEquity.toFixed(1)}%</strong> of the time.
            {canDecide ? (
              <>
                {" "}Your simulated equity is <strong className="mono">{heroPct.toFixed(1)}%</strong>, so this
                call is{" "}
                <strong style={{ color: isProfitableCall ? C.felt : C.ruby }}>
                  {isProfitableCall ? "profitable (+EV) — call it" : "a loser (−EV) — fold"}
                </strong>.
              </>
            ) : (
              <> Run a simulation on the <button onClick={() => setActivePage("calculadora")} style={{ color: C.felt, textDecoration: "underline", fontWeight: 600 }}>Calculator</button> tab to compare against your real equity.</>
            )}
          </p>
        </Section>

        <Section title="Implied odds: looking beyond this bet">
          <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
            Pot odds only look at the pot right now. <strong>Implied odds</strong> add the extra money you
            expect to win <em>later</em> if you complete your hand — for example, when you have a flush draw
            and expect the villain to pay off another bet on the river if you hit. This means a call that
            looks −EV by pure pot odds can be +EV in practice, if the villain tends to pay big bets afterward.
            The opposite also exists: <strong>reverse implied odds</strong>, where completing your hand can
            still lose to a better hand — common with "small" draws like a low straight against a board that
            also allows a flush.
          </p>
        </Section>

        <Section title="And when you bet or raise instead of calling?">
          <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
            So far we've looked at the decision to <em>call</em>. But betting or raising changes the problem:
            now you win in two ways — when the villain folds (you take the pot regardless of your hand) or
            when they call and you have the better hand. The chance they fold is called <strong>fold equity</strong>.
          </p>

          <div className="flex flex-wrap gap-4 mb-3 mt-3">
            <Field label="Pot size before your bet">
              <input type="number" min="0" value={potSize} onChange={(e) => setPotSize(Number(e.target.value))} className="mono" style={inputStyle} />
            </Field>
            <Field label="How much you'd bet (raise/bet)">

            </Field>
          </div>

          <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
            If your hand has <strong>zero</strong> chance when called (a pure bluff), the math is symmetric to
            pot odds — but from the other side of the table:
          </p>
          <div className="mono" style={{ background: "rgba(11,59,46,0.06)", borderRadius: 8, padding: "12px 16px", margin: "12px 0", fontSize: 14, color: C.felt }}>
            required fold equity = bet / (pot + bet)
          </div>
          <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
            With these numbers: you need the villain to fold at least{" "}
            <strong className="mono">{pureBluffFold.toFixed(1)}%</strong> of the time for a pure bluff to be worth it.
          </p>

          <Expand label="What if I have some chance even when called? (semi-bluff)">
            <p style={{ marginBottom: 10 }}>
              A <strong>semi-bluff</strong> is betting with a hand that isn't the best yet, but has outs — like
              a flush draw on the flop. You win in three ways: the villain folds now, or calls and you complete
              your hand, or calls and you don't (you lose).
            </p>
            <p style={{ marginBottom: 10 }}>
              The full EV formula: <span className="mono">EV = f × pot + (1−f) × (equity × (pot + 2×bet) − bet)</span>,
              where <span className="mono">f</span> is the villain's fold equity and <span className="mono">equity</span>{" "}
              is your chance of winning <em>when they call</em>. The term <span className="mono">(pot + 2×bet)</span>{" "}
              is the final pot if they call (the original pot, plus your bet, plus their call).
            </p>
            <p style={{ marginBottom: 10 }}>
              Solving this equation for f = 0 (same as we did for pot odds), we find the minimum fold equity
              needed for the semi-bluff to be worth it — and it comes out <em>lower</em> than for a pure bluff,
              because you have a second way to win even when called.
            </p>
            <div className="flex flex-wrap gap-4 my-3">
              <Field label="Your estimated equity IF called (%)">
                <input type="number" min="0" max="100" value={equityWhenCalled} onChange={(e) => setEquityWhenCalled(Number(e.target.value))} className="mono" style={inputStyle} />
              </Field>
            </div>
            <p className="mono" style={{ fontSize: 13, background: "rgba(28,27,25,0.04)", borderRadius: 8, padding: "10px 14px" }}>
              required fold equity (semi-bluff): <strong style={{ color: C.felt }}>{requiredFold.toFixed(1)}%</strong>{" "}
              (vs {pureBluffFold.toFixed(1)}% for a pure bluff with 0% equity)
            </p>
          </Expand>

          <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink, marginTop: 16 }}>
            Some practical guidelines for when each action tends to make sense:
          </p>
          <ul style={{ fontSize: 14.5, lineHeight: 1.9, color: C.ink, paddingLeft: 18 }}>
            <li><strong>Value raise:</strong> your equity is well above what the villain would need to call — you want worse hands to pay more, not for them to fold.</li>
            <li><strong>Bluffing/semi-bluffing makes more sense when:</strong> the board "looks scary" (favors a strong hand for you), the bet is small relative to the pot (lower required fold equity), you still have outs if called, and the opponent has already shown they fold easily in this type of spot.</li>
            <li><strong>Avoid bluffing when:</strong> the pot is already large relative to your bet (high required fold equity), the villain tends to call too much ("calling station"), or you have no outs if called.</li>
          </ul>
        </Section>
      </>
    );
  }

  return (
    <>
      <Section title="Valor esperado (EV)">
        <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
          EV é a média de quanto você ganha (ou perde) se repetisse a mesma decisão infinitas vezes.
          Para um call, de forma simplificada:
        </p>
        <div className="mono" style={{ background: "rgba(11,59,46,0.06)", borderRadius: 8, padding: "12px 16px", margin: "12px 0", fontSize: 14, color: C.felt }}>
          EV(call) = (equity × pote se ganhar) − ((1 − equity) × valor do call)
        </div>
        <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
          Se EV(call) for positivo, pagar é lucrativo no longo prazo — mesmo que você perca <em>essa</em> mão
          específica. Isso é o que separa decisão boa de resultado bom.
        </p>
        <div className="mono" style={{ fontSize: 12.5, background: "rgba(28,27,25,0.04)", borderRadius: 8, padding: "12px 14px", lineHeight: 1.8, color: C.ink }}>
          Exemplo: pote de 80, vilão aposta 20 (pote vira 100), você precisa pagar 20.<br />
          Sua equity é 30% → EV(call) = 0,30 × 100 − 0,70 × 20 = 30 − 14 = <strong style={{ color: C.felt }}>+16</strong><br />
          EV positivo: pagar é lucrativo, mesmo perdendo 70% das vezes.
        </div>
        <Expand label="Por que essa fórmula funciona? (exemplo com uma aposta simples)">
          <p style={{ marginBottom: 10 }}>
            Imagine uma aposta fora do poker: você paga R$20 para participar. Se um certo evento acontece (30%
            de chance), você recebe R$100 de volta. Se não acontece (70% de chance), perde os R$20.
          </p>
          <p style={{ marginBottom: 10 }}>
            <strong>Passo 1:</strong> Nos 30% das vezes que dá certo, seu ganho líquido é R$100 (o prêmio) − R$20
            (o que você pagou) = mas para simplificar, tratamos como "ganha o pote" e separado "perde o call" —
            é assim que EV é normalmente calculado em poker, olhando o pote e o custo do call separadamente.
          </p>
          <p style={{ marginBottom: 10 }}>
            <strong>Passo 2:</strong> Multiplique cada resultado pela sua chance: 30% das vezes você ganha o pote
            inteiro (100) → 0,30 × 100 = 30. 70% das vezes você só perde o que pagou (20) → 0,70 × 20 = 14 de
            prejuízo esperado.
          </p>
          <p style={{ marginBottom: 10 }}>
            <strong>Passo 3:</strong> Some ganho esperado menos perda esperada: 30 − 14 = <strong>+16</strong>.
            Positivo significa que, repetindo essa decisão muitas vezes, você sai ganhando em média — mesmo
            perdendo a maioria das vezes individualmente.
          </p>
          <p>
            Esse é o mesmo raciocínio do exemplo do dado na aba Fundamentos: multiplicar cada desfecho por sua
            probabilidade, e somar.
          </p>
        </Expand>
      </Section>

      <Section title="Pot odds: o atalho para decidir um call">
        <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
          Em vez de calcular EV em dinheiro, dá pra converter direto em <strong>% de equity necessária</strong>:
        </p>
        <div className="mono" style={{ background: "rgba(11,59,46,0.06)", borderRadius: 8, padding: "12px 16px", margin: "12px 0", fontSize: 14, color: C.felt }}>
          equity necessária = valor do call / (pote + valor do call)
        </div>
        <Expand label="Como essa fórmula é derivada da fórmula de EV acima">
          <p style={{ marginBottom: 10 }}>
            Queremos achar o ponto de equilíbrio: a equity mínima que faz EV(call) = 0 — abaixo disso, call é
            prejuízo; acima, é lucro.
          </p>
          <p style={{ marginBottom: 10 }}>
            Partindo de <span className="mono">EV = equity × pote − (1 − equity) × call</span>, igualamos a
            zero: <span className="mono">0 = equity × pote − (1 − equity) × call</span>.
          </p>
          <p style={{ marginBottom: 10 }}>
            Expandindo: <span className="mono">0 = equity × pote − call + equity × call</span>. Juntando os
            termos com "equity": <span className="mono">call = equity × (pote + call)</span>.
          </p>
          <p>
            Isolando equity: <span className="mono">equity = call / (pote + call)</span> — exatamente a fórmula
            de pot odds. Ela nada mais é do que "resolver a equação de EV para equity igual a zero".
          </p>
        </Expand>
        <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink, margin: "16px 0" }}>
          Se sua equity real (calculada na aba Calculadora) for <strong>maior</strong> que essa % exigida, pagar
          é +EV. Se for menor, é −EV — desista.
        </p>

        <div className="flex flex-wrap gap-4 mb-3">
          <Field label="Tamanho do pote (já com a aposta do vilão)">
            <input type="number" min="0" value={potSize} onChange={(e) => setPotSize(Number(e.target.value))} className="mono" style={inputStyle} />
          </Field>
          <Field label="Quanto você precisa pagar (call)">
            <input type="number" min="0" value={betToCall} onChange={(e) => setBetToCall(Number(e.target.value))} className="mono" style={inputStyle} />
          </Field>
        </div>
        <p style={{ fontSize: 14.5, lineHeight: 1.6, color: C.ink }}>
          Pot odds de <span className="mono">{potSize}:{betToCall}</span> → você precisa ganhar pelo menos{" "}
          <strong className="mono">{requiredEquity.toFixed(1)}%</strong> das vezes.
          {canDecide ? (
            <>
              {" "}Sua equity simulada é <strong className="mono">{heroPct.toFixed(1)}%</strong>, então este call é{" "}
              <strong style={{ color: isProfitableCall ? C.felt : C.ruby }}>
                {isProfitableCall ? "lucrativo (+EV) — pague" : "perdedor (−EV) — desista"}
              </strong>.
            </>
          ) : (
            <> Rode uma simulação na aba <button onClick={() => setActivePage("calculadora")} style={{ color: C.felt, textDecoration: "underline", fontWeight: 600 }}>Calculadora</button> para comparar com sua equity real.</>
          )}
        </p>
      </Section>

      <Section title="Implied odds: olhando além dessa aposta">
        <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
          Pot odds só olha o pote de agora. <strong>Implied odds</strong> soma o dinheiro extra que você espera
          ganhar <em>depois</em>, se completar sua mão — por exemplo, quando você tem um projeto de flush e
          espera que o vilão pague mais uma aposta no river se você acertar. Isso significa que um call que
          parece −EV pelas pot odds puras pode ser +EV na prática, se o vilão tende a pagar apostas grandes
          depois. O oposto também existe: <strong>reverse implied odds</strong>, quando completar sua mão ainda
          assim pode perder para uma mão melhor do vilão — comum com projetos "pequenos" tipo uma sequência
          baixa contra um board que também permite flush.
        </p>
      </Section>

      <Section title="E quando você aposta (raise) em vez de pagar?">
        <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
          Até aqui vimos a decisão de <em>pagar</em>. Mas apostar ou dar raise muda o problema: agora você
          ganha de duas formas — quando o vilão desiste (você fica com o pote, independente da sua mão) ou
          quando ele paga e você tem a mão melhor. A chance de ele desistir se chama <strong>fold equity</strong>.
        </p>

        <div className="flex flex-wrap gap-4 mb-3 mt-3">
          <Field label="Tamanho do pote antes da sua aposta">
            <input type="number" min="0" value={potSize} onChange={(e) => setPotSize(Number(e.target.value))} className="mono" style={inputStyle} />
          </Field>
          <Field label="Quanto você apostaria (raise/bet)">
            <input type="number" min="0" value={betSize} onChange={(e) => setBetSize(Number(e.target.value))} className="mono" style={inputStyle} />
          </Field>
        </div>

        <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
          Se sua mão não tiver <strong>nenhuma</strong> chance quando for paga (um blefe puro), a matemática é
          simétrica à pot odds — mas do outro lado da mesa:
        </p>
        <div className="mono" style={{ background: "rgba(11,59,46,0.06)", borderRadius: 8, padding: "12px 16px", margin: "12px 0", fontSize: 14, color: C.felt }}>
          fold equity necessária = aposta / (pote + aposta)
        </div>
        <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
          Com esses números: você precisa que o vilão desista pelo menos{" "}
          <strong className="mono">{pureBluffFold.toFixed(1)}%</strong> das vezes para um blefe puro valer a pena.
        </p>

        <Expand label="E se eu tenho alguma chance mesmo sendo pago? (semi-blefe)">
          <p style={{ marginBottom: 10 }}>
            Um <strong>semi-blefe</strong> é apostar com uma mão que ainda não é a melhor, mas tem outs — tipo
            um projeto de flush no flop. Você ganha de três formas: o vilão desiste agora, ou paga e você
            completa sua mão, ou paga e você não completa (perde).
          </p>
          <p style={{ marginBottom: 10 }}>
            A fórmula completa de EV: <span className="mono">EV = f × pote + (1−f) × (equity × (pote + 2×aposta) − aposta)</span>,
            onde <span className="mono">f</span> é a fold equity do vilão e <span className="mono">equity</span> é
            sua chance de vencer <em>quando ele paga</em>. O termo <span className="mono">(pote + 2×aposta)</span>{" "}
            é o pote final se ele pagar (o pote original, mais sua aposta, mais o call dele).
          </p>
          <p style={{ marginBottom: 10 }}>
            Resolvendo essa equação para f = 0 (igual fizemos com pot odds), achamos a fold equity mínima
            necessária para o semi-blefe valer a pena — e ela fica <em>menor</em> que a de um blefe puro, porque
            você tem uma segunda chance de ganhar mesmo sendo pago.
          </p>
          <div className="flex flex-wrap gap-4 my-3">
            <Field label="Sua equity estimada SE for pago (%)">
              <input type="number" min="0" max="100" value={equityWhenCalled} onChange={(e) => setEquityWhenCalled(Number(e.target.value))} className="mono" style={inputStyle} />
            </Field>
          </div>
          <p className="mono" style={{ fontSize: 13, background: "rgba(28,27,25,0.04)", borderRadius: 8, padding: "10px 14px" }}>
            fold equity necessária (semi-blefe): <strong style={{ color: C.felt }}>{requiredFold.toFixed(1)}%</strong>{" "}
            (contra {pureBluffFold.toFixed(1)}% se fosse um blefe puro com 0% de equity)
          </p>
        </Expand>

        <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink, marginTop: 16 }}>
          Algumas ideias práticas de quando cada ação costuma fazer sentido:
        </p>
        <ul style={{ fontSize: 14.5, lineHeight: 1.9, color: C.ink, paddingLeft: 18 }}>
          <li><strong>Raise por valor:</strong> sua equity está bem acima do que o vilão precisaria para pagar — você quer que mãos piores paguem mais, não que ele desista.</li>
          <li><strong>Blefe/semi-blefe faz mais sentido quando:</strong> o board "assusta" (parece favorecer uma mão forte sua), a aposta é pequena relativo ao pote (fold equity necessária menor), você ainda tem outs caso seja pago, e o oponente já demonstrou que desiste com facilidade nesse tipo de spot.</li>
          <li><strong>Evite blefar quando:</strong> o pote já está grande relativo à sua aposta (fold equity necessária alta), o vilão tende a pagar demais ("calling station"), ou você não tem outs se for pago.</li>
        </ul>
      </Section>
    </>
  );
}

function MonteCarloPage({ lang, heroCards, boardCount, boardCards, villainMode, villainCards, rangeSelection }) {
  const [steps, setSteps] = useState(null);
  const [running, setRunning] = useState(false);
  const heroReady = heroCards[0] && heroCards[1];
  const villainReady = villainMode === "specific" ? villainCards[0] && villainCards[1] : rangeSelection.size > 0;
  const locale = lang === "en" ? "en-US" : "pt-BR";

  const runConvergence = () => {
    setRunning(true);
    setTimeout(() => {
      const board = boardCards.slice(0, boardCount);
      const rangeCombosAll = villainMode === "range" ? [...rangeSelection].flatMap((k) => generateComboCards(k)) : null;
      const trialCounts = [50, 200, 1000, 5000, 20000];
      const out = trialCounts.map((t) => {
        const res = simulate({ hero: heroCards, board, villainMode, villainFixed: villainCards, rangeCombosAll, trials: t });
        const pct = res ? ((res.heroWin + res.tie / 2) / res.trials) * 100 : null;
        const p = pct !== null ? pct / 100 : null;
        const se = p !== null ? Math.sqrt((p * (1 - p)) / t) * 100 : null;
        return { trials: t, pct, se };
      });
      setSteps(out);
      setRunning(false);
    }, 30);
  };

  if (lang === "en") {
    return (
      <>
        <Section title="Why simulate instead of calculating exactly">
          <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
            With the flop on the table, 2 more cards still need to come from the ~45 remaining — that already
            gives thousands of possible outcomes, even more when the villain has a whole range of hands.
            Instead of enumerating everything, the <strong>Monte Carlo</strong> method draws one random
            outcome at a time, sees who won, and repeats thousands of times. The fraction of wins converges to
            the real probability — that's the <strong>Law of Large Numbers</strong>.
          </p>
          <Expand label="Law of Large Numbers, with coins instead of cards">
            <p style={{ marginBottom: 10 }}>
              Flip a fair coin 10 times. It's quite common to get, say, 7 heads and 3 tails — 70%, far from
              the "theoretical" 50%. With few trials, chance carries a lot of weight.
            </p>
            <p style={{ marginBottom: 10 }}>
              Now flip the same coin 10,000 times. The proportion of heads almost certainly lands between 49%
              and 51% — very close to the expected 50%. No individual flip "knows" it should land at 50%, but
              when you add up many, the deviations up and down tend to cancel out.
            </p>
            <p>
              That's exactly the principle that lets us estimate equity: each individual simulation is like a
              coin flip — unpredictable alone — but the average of thousands of them converges to the real
              probability, whether it's 50%, 27%, or 83%.
            </p>
          </Expand>
        </Section>

        <Section title="How reliable is the estimate?">
          <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
            Each simulation is like a political poll: the more "respondents" (hands simulated), the smaller
            the margin of error. For an estimated proportion <span className="mono">p</span> with{" "}
            <span className="mono">n</span> simulations, the standard error is:
          </p>
          <div className="mono" style={{ background: "rgba(11,59,46,0.06)", borderRadius: 8, padding: "12px 16px", margin: "12px 0", fontSize: 14, color: C.felt }}>
            standard error = √( p × (1 − p) / n )
          </div>
          <Expand label="Why this specific formula? (intuition, without a formal proof)">
            <p style={{ marginBottom: 10 }}>
              Two ideas explain this formula. First, the term <span className="mono">p × (1−p)</span> is
              largest when p is close to 50% (most unpredictable mix) and smallest when p is close to 0% or
              100% (near-certain outcome, little variation possible). Makes sense: it's harder to "nail" the
              exact proportion of something close to a coin flip than something nearly guaranteed.
            </p>
            <p style={{ marginBottom: 10 }}>
              Second, dividing by <span className="mono">n</span> (and taking the square root) reflects that
              adding more observations reduces uncertainty — but with diminishing returns: to cut the error in
              half, you need to <strong>quadruple</strong> the number of simulations (because of the square
              root). That's why going from 5,000 to 20,000 simulations helps a lot, but going from 20,000 to
              40,000 helps proportionally less.
            </p>
            <p>
              The same principle explains why political polls with ~1,000 to 2,000 respondents already achieve
              margins of error of 2-3%: it's not the size of the total population that matters, it's the
              sample size.
            </p>
          </Expand>
          <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink, marginTop: 12 }}>
            With 1,000 simulations and an equity near 50%, the standard error is close to 1.6 percentage
            points; with 20,000, it drops to about 0.35. That's why the Calculator offers more simulation
            options when you need more precision — and why the result of fewer simulations swings more in the
            table below.
          </p>
        </Section>

        <Section title="The algorithm, step by step">
          <ol style={{ fontSize: 14.5, lineHeight: 1.9, color: C.ink, paddingLeft: 18 }}>
            <li>Remove the already-known cards from the deck (your hand + board).</li>
            <li>Draw the villain's hand (fixed, or a random combo from the selected range).</li>
            <li>Draw the missing board cards until it reaches 5.</li>
            <li>Compare each player's best 5-card hand (among the possible combinations from their 7 available cards).</li>
            <li>Record who won — and repeat thousands of times.</li>
          </ol>
        </Section>

        <Section title="See the convergence with your current hand" note="Uses hero/board/villain from the Calculator tab">
          {!heroReady || !villainReady ? (
            <p style={{ fontSize: 14, color: "rgba(28,27,25,0.6)" }}>
              Complete your hand and the villain on the Calculator tab to run this test.
            </p>
          ) : (
            <div>
              <button onClick={runConvergence} disabled={running} style={{ background: C.felt, color: C.ivory, border: "none", borderRadius: 8, padding: "9px 18px", fontWeight: 600, fontSize: 13.5, marginBottom: 16, opacity: running ? 0.7 : 1 }}>
                {running ? "Running…" : "Run in increasing steps"}
              </button>
              {steps && (
                <div className="flex flex-col gap-2">
                  {steps.map((s) => (
                    <div key={s.trials} className="flex items-center gap-3">
                      <span className="mono" style={{ fontSize: 11.5, width: 84, color: "rgba(28,27,25,0.6)" }}>{s.trials.toLocaleString(locale)}×</span>
                      <div style={{ flex: 1, height: 10, borderRadius: 5, background: "rgba(28,27,25,0.08)", overflow: "hidden" }}>
                        <div style={{ width: `${s.pct}%`, height: "100%", background: C.felt }} />
                      </div>
                      <span className="mono" style={{ fontSize: 12.5, width: 90, textAlign: "right", color: C.ink, fontWeight: 600 }}>{s.pct.toFixed(1)}% ±{s.se.toFixed(1)}</span>
                    </div>
                  ))}
                  <p style={{ fontSize: 12.5, color: "rgba(28,27,25,0.55)", marginTop: 8 }}>
                    Notice how the margin of error (±, the standard error) shrinks as the number of simulations
                    grows, and the estimate settles down.
                  </p>
                </div>
              )}
            </div>
          )}
        </Section>
      </>
    );
  }

  return (
    <>
      <Section title="Por que simular em vez de calcular exato">
        <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
          Com o flop na mesa, ainda faltam sair 2 cartas entre as ~45 restantes — isso já dá milhares de finais
          possíveis, e mais ainda quando o vilão tem um range inteiro de mãos. Em vez de enumerar tudo, o método{" "}
          <strong>Monte Carlo</strong> sorteia um final aleatório de cada vez, vê quem venceu, e repete milhares
          de vezes. A fração de vitórias converge para a probabilidade real — isso é a{" "}
          <strong>Lei dos Grandes Números</strong>.
        </p>
        <Expand label="Lei dos Grandes Números, com moedas em vez de cartas">
          <p style={{ marginBottom: 10 }}>
            Jogue uma moeda honesta 10 vezes. É bem comum sair, por exemplo, 7 caras e 3 coroas — 70%, bem longe
            dos 50% "teóricos". Com poucas tentativas, o acaso pesa muito.
          </p>
          <p style={{ marginBottom: 10 }}>
            Agora jogue a mesma moeda 10.000 vezes. A proporção de caras quase certamente fica entre 49% e 51%
            — bem perto dos 50% esperados. Nenhuma tentativa individual "sabe" que deveria dar 50%, mas quando
            você soma muitas, os desvios para cima e para baixo tendem a se cancelar.
          </p>
          <p>
            É exatamente esse princípio que permite estimar a equity: cada simulação individual é como um
            lançamento de moeda — imprevisível sozinha — mas a média de milhares delas converge para a
            probabilidade real, seja ela 50%, 27% ou 83%.
          </p>
        </Expand>
      </Section>

      <Section title="Quão confiável é a estimativa?">
        <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink }}>
          Cada simulação é como uma pesquisa eleitoral: quanto mais "entrevistados" (mãos simuladas), menor a
          margem de erro. Para uma proporção estimada <span className="mono">p</span> com{" "}
          <span className="mono">n</span> simulações, o erro padrão é:
        </p>
        <div className="mono" style={{ background: "rgba(11,59,46,0.06)", borderRadius: 8, padding: "12px 16px", margin: "12px 0", fontSize: 14, color: C.felt }}>
          erro padrão = √( p × (1 − p) / n )
        </div>
        <Expand label="Por que essa fórmula específica? (intuição, sem provar formalmente)">
          <p style={{ marginBottom: 10 }}>
            Duas ideias explicam essa fórmula. Primeiro, o termo <span className="mono">p × (1−p)</span> é maior
            quando p está perto de 50% (mistura mais imprevisível) e menor quando p está perto de 0% ou 100%
            (resultado quase certo, pouca variação possível). Faz sentido: é mais difícil "acertar" a proporção
            exata de algo que é quase um empate do que de algo quase garantido.
          </p>
          <p style={{ marginBottom: 10 }}>
            Segundo, dividir por <span className="mono">n</span> (e tirar a raiz) reflete que juntar mais
            observações reduz a incerteza — mas com retornos decrescentes: para reduzir o erro pela metade,
            você precisa <strong>quadruplicar</strong> o número de simulações (por causa da raiz quadrada). É
            por isso que ir de 5.000 para 20.000 simulações ajuda bastante, mas ir de 20.000 para 40.000 ajuda
            proporcionalmente menos.
          </p>
          <p>
            O mesmo princípio explica por que pesquisas eleitorais com ~1.000 a 2.000 entrevistados já
            conseguem margens de erro de 2-3%: não é o tamanho da população total que importa, é o tamanho da
            amostra.
          </p>
        </Expand>
        <p style={{ fontSize: 14.5, lineHeight: 1.7, color: C.ink, marginTop: 12 }}>
          Com 1.000 simulações e uma equity perto de 50%, o erro padrão fica perto de 1,6 pontos percentuais;
          com 20.000, cai para cerca de 0,35. É por isso que a Calculadora oferece a opção de mais simulações
          quando você precisa de mais precisão — e por isso que o resultado de poucas simulações oscila mais
          na tabela abaixo.
        </p>
      </Section>

      <Section title="O algoritmo, passo a passo">
        <ol style={{ fontSize: 14.5, lineHeight: 1.9, color: C.ink, paddingLeft: 18 }}>
          <li>Remove do baralho as cartas já conhecidas (sua mão + board).</li>
          <li>Sorteia a mão do vilão (fixa, ou uma combinação aleatória do range selecionado).</li>
          <li>Sorteia as cartas que faltam no board até completar 5.</li>
          <li>Compara a melhor mão de 5 cartas de cada jogador (entre as combinações possíveis das 7 cartas disponíveis).</li>
          <li>Registra quem venceu — e repete milhares de vezes.</li>
        </ol>
      </Section>

      <Section title="Veja a convergência com sua mão atual" note="Usa hero/board/vilão da aba Calculadora">
        {!heroReady || !villainReady ? (
          <p style={{ fontSize: 14, color: "rgba(28,27,25,0.6)" }}>
            Complete sua mão e o vilão na aba Calculadora para rodar este teste.
          </p>
        ) : (
          <div>
            <button onClick={runConvergence} disabled={running} style={{ background: C.felt, color: C.ivory, border: "none", borderRadius: 8, padding: "9px 18px", fontWeight: 600, fontSize: 13.5, marginBottom: 16, opacity: running ? 0.7 : 1 }}>
              {running ? "Rodando…" : "Rodar em passos crescentes"}
            </button>
            {steps && (
              <div className="flex flex-col gap-2">
                {steps.map((s) => (
                  <div key={s.trials} className="flex items-center gap-3">
                    <span className="mono" style={{ fontSize: 11.5, width: 84, color: "rgba(28,27,25,0.6)" }}>{s.trials.toLocaleString(locale)}×</span>
                    <div style={{ flex: 1, height: 10, borderRadius: 5, background: "rgba(28,27,25,0.08)", overflow: "hidden" }}>
                      <div style={{ width: `${s.pct}%`, height: "100%", background: C.felt }} />
                    </div>
                    <span className="mono" style={{ fontSize: 12.5, width: 90, textAlign: "right", color: C.ink, fontWeight: 600 }}>{s.pct.toFixed(1)}% ±{s.se.toFixed(1)}</span>
                  </div>
                ))}
                <p style={{ fontSize: 12.5, color: "rgba(28,27,25,0.55)", marginTop: 8 }}>
                  Repare como a margem de erro (±, o erro padrão) encolhe conforme o número de simulações cresce,
                  e a estimativa se estabiliza.
                </p>
              </div>
            )}
          </div>
        )}
      </Section>
    </>
  );
}

const PAGES = [
  { id: "guia", pt: "Guia", en: "Guide" },
  { id: "fundamentos", pt: "Fundamentos", en: "Fundamentals" },
  { id: "outs", pt: "Outs & Regra 2-4", en: "Outs & Rule of 2-4" },
  { id: "ev", pt: "EV & Pot Odds", en: "EV & Pot Odds" },
  { id: "montecarlo", pt: "Monte Carlo", en: "Monte Carlo" },

];

function App() {
  const [lang, setLang] = useState("pt");
  const [activePage, setActivePage] = useState("guia");
  const [heroCards, setHeroCards] = useState([null, null]);
  const [boardCount, setBoardCount] = useState(0);
  const [boardCards, setBoardCards] = useState([null, null, null, null, null]);
  const [villainMode, setVillainMode] = useState("specific");
  const [villainCards, setVillainCards] = useState([null, null]);
  const [rangeSelection, setRangeSelection] = useState(new Set());
  const [trials, setTrials] = useState(5000);
  const [results, setResults] = useState(null);
  const [simulating, setSimulating] = useState(false);
  const [progress, setProgress] = useState(0);
  const [error, setError] = useState("");
  const [picker, setPicker] = useState(null);
  const [potSize, setPotSize] = useState(100);
  const [betToCall, setBetToCall] = useState(25);

  const usedKeys = useMemo(() => {
    const s = new Set();
    heroCards.forEach((c) => c && s.add(c.key));
    boardCards.slice(0, boardCount).forEach((c) => c && s.add(c.key));
    if (villainMode === "specific") villainCards.forEach((c) => c && s.add(c.key));
    return s;
  }, [heroCards, boardCards, boardCount, villainMode, villainCards]);

  const openPicker = (target, index) => setPicker({ target, index });

  const assignCard = (card) => {
    if (!picker) return;
    const { target, index } = picker;
    if (target === "hero") { const next = [...heroCards]; next[index] = card; setHeroCards(next); }
    else if (target === "board") { const next = [...boardCards]; next[index] = card; setBoardCards(next); }
    else if (target === "villain") { const next = [...villainCards]; next[index] = card; setVillainCards(next); }
    setResults(null);
    setPicker(null);
  };

  const toggleRangeCell = (key) => {
    const next = new Set(rangeSelection);
    next.has(key) ? next.delete(key) : next.add(key);
    setRangeSelection(next);
    setResults(null);
  };

  const applyPreset = (fn) => { setRangeSelection(fn()); setResults(null); };

  const runSimulation = useCallback(() => {
    setError("");
    const en = lang === "en";
    if (!heroCards[0] || !heroCards[1]) { setError(en ? "Choose both hero cards first." : "Escolha as duas cartas do herói primeiro."); return; }
    const board = boardCards.slice(0, boardCount);
    if (board.some((c) => !c)) { setError(en ? "Complete the board cards (or go back a stage)." : "Complete as cartas do board (ou reduza a etapa)."); return; }
    if (villainMode === "specific") {
      if (!villainCards[0] || !villainCards[1]) { setError(en ? "Choose the villain's two cards, or switch to 'Range'." : "Escolha as duas cartas do vilão, ou mude para 'Range'."); return; }
    } else if (rangeSelection.size === 0) { setError(en ? "Select at least one hand in the villain's range." : "Selecione ao menos uma mão no range do vilão."); return; }

    const rangeCombosAll = villainMode === "range" ? [...rangeSelection].flatMap((k) => generateComboCards(k)) : null;
    const setup = buildSimSetup({ hero: heroCards, board, villainMode, villainFixed: villainCards, rangeCombosAll });
    if (!setup) { setError(en ? "No valid villain combo remained (card conflict)." : "Nenhuma combinação válida do vilão sobrou (conflito de cartas)."); return; }

    setSimulating(true);
    setProgress(0);
    const acc = { heroWin: 0, tie: 0, villWin: 0 };
    let done = 0;
    const batchSize = 2000;

    function step() {
      const n = Math.min(batchSize, trials - done);
      const r = runBatch(setup, heroCards, board, villainMode, villainCards, n);
      acc.heroWin += r.heroWin; acc.tie += r.tie; acc.villWin += r.villWin;
      done += n;
      setProgress(done / trials);
      if (done < trials) {
        setTimeout(step, 0);
      } else {
        setResults({ heroWin: acc.heroWin, tie: acc.tie, villWin: acc.villWin, trials, deckSizeAtStart: setup.deckSizeAtStart, comboPoolSize: setup.comboPool ? setup.comboPool.length : null });
        setSimulating(false);
      }
    }
    step();
  }, [heroCards, boardCards, boardCount, villainMode, villainCards, rangeSelection, trials, lang]);

  const sharedState = {
    lang, heroCards, boardCount, boardCards, villainMode, setVillainMode, villainCards,
    rangeSelection, toggleRangeCell, applyPreset, trials, setTrials, results, simulating, progress,
    error, openPicker, setBoardCount, setBoardCards, setResults, runSimulation, setActivePage,
  };

  const en = lang === "en";

  return (
    <div style={{ fontFamily: "'Inter', sans-serif", background: C.felt, minHeight: "100vh" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');
        .felt-texture { background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.035), transparent 40%), radial-gradient(circle at 80% 80%, rgba(255,255,255,0.03), transparent 45%); }
        .display { font-family: 'Fraunces', serif; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
        button { cursor: pointer; }
        ::selection { background: #C9A24B; color: #14100D; }
      `}</style>

      <div className="felt-texture" style={{ padding: "48px 20px 28px", textAlign: "center", borderBottom: "1px solid rgba(201,162,75,0.35)", position: "relative" }}>
        <div style={{ position: "absolute", top: "calc(14px + env(safe-area-inset-top, 0px))", right: 16, display: "flex", background: "rgba(237,230,214,0.1)", borderRadius: 20, padding: 3, border: "1px solid rgba(201,162,75,0.4)" }}>
          <button onClick={() => setLang("pt")} className="mono" style={{ padding: "5px 12px", borderRadius: 16, fontSize: 11.5, fontWeight: 700, background: !en ? C.brass : "transparent", color: !en ? "#14100D" : "rgba(237,230,214,0.7)" }}>PT</button>
          <button onClick={() => setLang("en")} className="mono" style={{ padding: "5px 12px", borderRadius: 16, fontSize: 11.5, fontWeight: 700, background: en ? C.brass : "transparent", color: en ? "#14100D" : "rgba(237,230,214,0.7)" }}>EN</button>
        </div>
        <div className="mono" style={{ color: C.brass, fontSize: 13, letterSpacing: "0.25em", marginBottom: 14 }}>{en ? "TEXAS HOLD'EM · MONTE CARLO SIMULATOR" : "TEXAS HOLD'EM · SIMULADOR MONTE CARLO"}</div>
        <h1 className="display" style={{ color: C.ivory, fontSize: "clamp(32px, 6vw, 54px)", fontWeight: 600, margin: 0 }}>{en ? "The Equity Table" : "A Mesa de Equity"}</h1>
        <p style={{ color: "rgba(237,230,214,0.75)", maxWidth: 560, margin: "14px auto 0", fontSize: 15.5, lineHeight: 1.6 }}>
          {en
            ? "A short course in probability applied to poker, with an equity calculator at the end — start with the Guide, or jump straight to whichever concept you want."
            : "Um curso curto de probabilidade aplicada ao poker, com uma calculadora de equity no final — comece pelo Guia, ou pule direto pro conceito que quiser."}
        </p>
      </div>

      <div style={{ position: "sticky", top: "env(safe-area-inset-top, 0px)", zIndex: 10, background: C.ivory, borderBottom: "1px solid rgba(28,27,25,0.12)", overflowX: "auto" }}>
        <div style={{ maxWidth: 880, margin: "0 auto", display: "flex", gap: 2, padding: "0 12px" }}>
          {PAGES.map((p) => (
            <button key={p.id} onClick={() => setActivePage(p.id)} className="mono" style={{
              padding: "13px 14px", fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap",
              background: "none", border: "none", borderBottom: activePage === p.id ? `2.5px solid ${C.felt}` : "2.5px solid transparent",
              color: activePage === p.id ? C.felt : "rgba(28,27,25,0.5)",
            }}>{en ? p.en : p.pt}</button>
          ))}
        </div>
      </div>

      <div style={{ maxWidth: 880, margin: "0 auto", padding: "32px 18px 80px" }}>
        <div style={{ background: C.ivory, borderRadius: 14, padding: "28px 24px", boxShadow: "0 10px 30px rgba(0,0,0,0.35)" }}>
          {activePage === "guia" && <GuiaPage lang={lang} setActivePage={setActivePage} />}
          {activePage === "calculadora" && <CalculadoraPage {...sharedState} />}
          {activePage === "fundamentos" && <FundamentosPage lang={lang} />}
          {activePage === "outs" && <OutsPage lang={lang} heroCards={heroCards} boardCount={boardCount} boardCards={boardCards} setActivePage={setActivePage} results={results} villainMode={villainMode} />}
          {activePage === "ev" && <EVPage lang={lang} potSize={potSize} setPotSize={setPotSize} betToCall={betToCall} setBetToCall={setBetToCall} results={results} setActivePage={setActivePage} />}
          {activePage === "montecarlo" && <MonteCarloPage lang={lang} heroCards={heroCards} boardCount={boardCount} boardCards={boardCards} villainMode={villainMode} villainCards={villainCards} rangeSelection={rangeSelection} />}

          {activePage === "calculadora" && (
            <div style={{ borderTop: "1px solid rgba(28,27,25,0.15)", paddingTop: 22, marginTop: 8 }}>
              <h3 className="display" style={{ fontSize: 19, fontWeight: 600, marginBottom: 14, color: C.ink }}>{en ? "Quick concepts" : "Conceitos rápidos"}</h3>
              <div className="grid gap-4" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))" }}>
                {en ? (
                  <>
                    <Glossary symbol="♠" title="Equity" text="The % of the time your hand wins if the rest of the cards come out randomly. See the Monte Carlo tab to understand how it's calculated." />
                    <Glossary symbol="♦" title="Pot odds" text="The relationship between how much you pay and the pot. Fully explored on the EV & Pot Odds tab." />
                    <Glossary symbol="♣" title="Outs" text="Cards that improve your hand. Count yours on the Outs & Rule of 2-4 tab." />
                  </>
                ) : (
                  <>
                    <Glossary symbol="♠" title="Equity" text="A % de vezes que sua mão vence se o resto das cartas saírem aleatoriamente. Veja a aba Monte Carlo para entender como é calculada." />
                    <Glossary symbol="♦" title="Pot odds" text="A relação entre quanto você paga e o pote. Explorada por completo na aba EV & Pot Odds." />
                    <Glossary symbol="♣" title="Outs" text="Cartas que melhoram sua mão. Conte a sua na aba Outs & Regra 2-4." />
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      </div>

      {picker && (
        <div onClick={() => setPicker(null)} style={{ position: "fixed", inset: 0, background: "rgba(11,15,13,0.65)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, zIndex: 50 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: C.ivory, borderRadius: 12, padding: 20, maxWidth: 420, width: "100%", boxShadow: "0 20px 50px rgba(0,0,0,0.5)" }}>
            <div className="flex justify-between items-center mb-3">
              <h4 className="display" style={{ fontSize: 17, fontWeight: 600, color: C.ink }}>{en ? "Choose a card" : "Escolha uma carta"}</h4>
              <button onClick={() => setPicker(null)} style={{ color: C.ink, fontSize: 18 }}>✕</button>
            </div>
            <div className="flex flex-col gap-1.5">
              {SUITS.map((s) => (
                <div key={s} className="flex gap-1.5">
                  {RANK_CHARS.map((r) => {
                    const key = r + s;
                    const used = usedKeys.has(key);
                    const red = SUIT_RED[s];
                    return (
                      <button key={key} disabled={used} onClick={() => assignCard({ rank: RANK_VALUE[r], suit: s, char: r, key })} className="mono" style={{
                        flex: 1, height: 34, borderRadius: 5, fontSize: 12.5, fontWeight: 600,
                        border: "1px solid rgba(28,27,25,0.2)", background: used ? "rgba(28,27,25,0.08)" : "#fff",
                        color: used ? "rgba(28,27,25,0.25)" : red ? C.ruby : C.ink,
                      }}>{r}{SUIT_SYMBOL[s]}</button>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
